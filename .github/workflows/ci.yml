name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:deps   # fails on known high/critical vulnerabilities in production dependencies
      - run: pnpm lint
      - run: pnpm build        # builds shared packages first (topological order)
      - run: pnpm typecheck
      - run: pnpm test         # Testcontainers uses the runner's Docker daemon

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [ledger, payments, webhook, reconciliation, mock-gateway, chaos-controller]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t zerodrift-${{ matrix.service }} .
