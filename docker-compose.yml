# Local stack. `docker compose up -d --build` starts everything.
name: zerodrift
x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-bookworm
    environment: { POSTGRES_USER: zerodrift, POSTGRES_PASSWORD: zerodrift }
    ports: ['55432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    command: ['postgres', '-c', 'max_connections=300']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zerodrift']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ['56379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 3s, timeout: 3s, retries: 20 }

  kafka:
    image: apache/kafka:3.9.0   # KRaft mode: no ZooKeeper
    ports: ['9094:9094']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ['8080:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: zerodrift
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: { kafka: { condition: service_healthy } }

  prometheus:
    image: prom/prometheus:latest
    ports: ['9090:9090']
    volumes: ['./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']

  grafana:
    image: grafana/grafana:latest
    ports: ['3000:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ['8474:8474']
    volumes: ['./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro']
    command: ['-host=0.0.0.0', '-config=/config/toxiproxy.json']

  ledger:
    <<: *service
    build: { context: ., args: { SERVICE: ledger } }
    ports: ['3001:3001']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://zerodrift:zerodrift@postgres:5432/ledger
      KAFKA_BROKERS: kafka:9092

  payments:
    <<: *service
    build: { context: ., args: { SERVICE: payments } }
    ports: ['3002:3002']
    depends_on:
      postgres: { condition: service_healthy }
      ledger: { condition: service_started }
      mock-gateway: { condition: service_started }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://zerodrift:zerodrift@postgres:5432/payments
      LEDGER_URL: http://ledger:3001
      GATEWAY_URL: http://mock-gateway:3005
      KAFKA_BROKERS: kafka:9092
      PUBLIC_URL: http://payments:3002
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      GATEWAY_CALLBACK_SECRET: ${GATEWAY_CALLBACK_SECRET:-dev-gateway-secret}

  webhook:
    <<: *service
    build: { context: ., args: { SERVICE: webhook } }
    ports: ['3003:3003']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://zerodrift:zerodrift@postgres:5432/webhook

  reconciliation:
    <<: *service
    build: { context: ., args: { SERVICE: reconciliation } }
    ports: ['3004:3004']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://zerodrift:zerodrift@postgres:5432/reconciliation

  mock-gateway:
    restart: unless-stopped
    build: { context: ., args: { SERVICE: mock-gateway } }
    ports: ['3005:3005']
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://zerodrift:zerodrift@postgres:5432/gateway
      # lets the gateway create its database on first boot even if the volume predates it
      ADMIN_DATABASE_URL: postgres://zerodrift:zerodrift@postgres:5432/postgres

  chaos-controller:
    restart: unless-stopped
    build: { context: ., args: { SERVICE: chaos-controller } }
    ports: ['3006:3006']
    environment: { NODE_ENV: development, CHAOS_ENABLED: 'true' }

volumes:
  pgdata:
