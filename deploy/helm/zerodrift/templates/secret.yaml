{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: zerodrift-secrets
  labels: { app.kubernetes.io/part-of: zerodrift }
type: Opaque
stringData:
  # `required` makes `helm install` fail loudly instead of deploying an unauthenticated system.
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (or set secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  adminToken: {{ required "secrets.adminToken is required" .Values.secrets.adminToken | quote }}
  gatewayCallbackSecret: {{ required "secrets.gatewayCallbackSecret is required" .Values.secrets.gatewayCallbackSecret | quote }}
  webhookEncryptionKey: {{ required "secrets.webhookEncryptionKey is required" .Values.secrets.webhookEncryptionKey | quote }}
  jwtSecret: {{ .Values.secrets.jwtSecret | default "" | quote }}
  dashboardPassword: {{ .Values.secrets.dashboardPassword | default "" | quote }}
{{- end }}
