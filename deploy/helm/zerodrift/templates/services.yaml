{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "zerodrift.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  type: {{ if $svc.nodePort }}NodePort{{ else }}{{ $root.Values.serviceType }}{{ end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      {{- if $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "zerodrift.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  # Never go below the desired capacity during a rollout: add a new pod first, then retire an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels: {{- include "zerodrift.labels" (dict "root" $root "name" $name) | nindent 8 }}
    spec:
      {{- if $svc.serviceAccount }}
      serviceAccountName: {{ $name }}
      {{- end }}
      # Give in-flight requests time to finish after SIGTERM (the services drain on shutdown).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Prefer spreading replicas over nodes so one node failing does not take every replica with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      containers:
        - name: app
          image: {{ include "zerodrift.image" (list $root $name $svc) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
          env:
            - { name: PORT, value: {{ $svc.port | quote }} }
            - { name: NODE_ENV, value: {{ default $root.Values.nodeEnv (get (default dict $svc.env) "NODE_ENV") | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ $name | quote }} }
            {{- if $root.Values.observability.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $root.Values.observability.otlpEndpoint | quote }} }
            {{- end }}
            # Kubernetes expands $(VAR) only for variables defined EARLIER in this list: keep these first.
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "zerodrift.secretName" $root }}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "zerodrift.secretName" $root }}, key: POSTGRES_PASSWORD } }
            {{- if $svc.database }}
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ $root.Values.infra.postgresHost }}:{{ $root.Values.infra.postgresPort }}/{{ $svc.database }}"
            {{- end }}
            {{- range $k, $v := (default dict $svc.secretEnv) }}
            - name: {{ $k }}
              valueFrom: { secretKeyRef: { name: {{ include "zerodrift.secretName" $root }}, key: {{ $v }} } }
            {{- end }}
            {{- range $k, $v := (default dict $svc.env) }}
            {{- if ne $k "NODE_ENV" }}
            - { name: {{ $k }}, value: {{ tpl $v $root | quote }} }
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: {{ default "/ready" (get (default dict $svc.probes) "ready") }}, port: http }
            periodSeconds: 3
            failureThreshold: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Stay in the pool briefly after SIGTERM is sent, so the Service has stopped routing to this pod
          # before it stops accepting connections.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources: {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- if gt (int $svc.replicas) 1 }}
---
# Voluntary disruptions (node drains, rollouts by other tools) may take down at most one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "zerodrift.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
