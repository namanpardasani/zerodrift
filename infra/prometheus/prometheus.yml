global:
  scrape_interval: 5s
scrape_configs:
  - job_name: ledger
    metrics_path: /metrics
    static_configs:
      - targets: ['ledger:3001']
  - job_name: payments
    metrics_path: /metrics
    static_configs:
      - targets: ['payments:3002']
  - job_name: webhook
    metrics_path: /metrics
    static_configs:
      - targets: ['webhook:3003']
  - job_name: reconciliation
    metrics_path: /metrics
    static_configs:
      - targets: ['reconciliation:3004']
  - job_name: mock-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['mock-gateway:3005']
  - job_name: dashboard-api
    metrics_path: /metrics
    static_configs:
      - targets: ['dashboard-api:3008']
